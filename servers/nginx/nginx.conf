load_module /usr/lib/nginx/modules/ngx_http_mesi_module.so;

worker_processes  1;
error_log  stderr debug;

pid        nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /usr/local/nginx/conf/mime.types;
    access_log stdout;
    default_type  text/html;

    keepalive_timeout  65;
    server {
        listen       8080;
        server_name  _;

        location / {
            enable_mesi on;
            # Test backend resolves to a private Docker IP; opt out of SSRF
            # blocking here so the existing include fixtures keep working.
            # Real deployments should leave the secure default (on) in place.
            mesi_block_private_ips off;
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location /cache/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_cache_backend memory;
            mesi_cache_size 10000;
            mesi_cache_ttl 30;
            alias /usr/share/nginx/html/;
        }

        location /cache/memcached/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_cache_backend memcached;
            mesi_cache_ttl 30;
            mesi_cache_memcached_servers "memcached:11211";
            alias /usr/share/nginx/html/;
        }

        # Cache key template: the same include URL is cached per
        # Accept-Language — distinct header variants get distinct cache
        # entries (mesi.BuildCacheKey via libgomesi ParseWithConfigCtx).
        location /cache-key-template/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_cache_backend memory;
            mesi_cache_size 10000;
            mesi_cache_ttl 30;
            mesi_cache_key_template "mesi:${url}:${header:Accept-Language}";
            alias /usr/share/nginx/html/;
        }

        # Cache key template control: memory cache WITHOUT a template —
        # the URL-only DefaultCacheKey must stay header-agnostic.
        location /cache-key-notemplate/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_cache_backend memory;
            mesi_cache_size 10000;
            mesi_cache_ttl 30;
            alias /usr/share/nginx/html/;
        }

        # SSRF protection: default (unset) must block private IPs.
        location /ssrf-default/ {
            enable_mesi on;
            alias  /usr/share/nginx/html/;
            index  ssrf.html;
        }

        # SSRF protection: explicit on must block private IPs.
        location /ssrf-on/ {
            enable_mesi on;
            mesi_block_private_ips on;
            alias  /usr/share/nginx/html/;
            index  ssrf.html;
        }

        # SSRF protection: explicit off must allow private IPs.
        location /ssrf-off/ {
            enable_mesi on;
            mesi_block_private_ips off;
            alias  /usr/share/nginx/html/;
            index  ssrf.html;
        }

        # AllowedHosts: explicit single-host whitelist.
        location /allowed/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_allowed_hosts backend;
            alias  /usr/share/nginx/html/;
            index  allowed.html;
        }

        # AllowedHosts: multiple space-separated hosts (one quoted argument).
        location /allowed-multi/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_allowed_hosts "backend sub.backend";
            alias  /usr/share/nginx/html/;
            index  allowed.html;
        }

        # AllowedHosts: unset — no hostname restriction (backward
        # compatible, subject to mesi_block_private_ips).
        location /allowed-unset/ {
            enable_mesi on;
            mesi_block_private_ips off;
            alias  /usr/share/nginx/html/;
            index  allowed.html;
        }

        # AllowedHosts: redirects — a 302 from an allowed backend to a host
        # outside the whitelist must NOT be followed (hop re-validation).
        location /allowed-redirect/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_allowed_hosts backend;
            alias  /usr/share/nginx/html/;
            index  redirect_include.html;
        }

        # AllowedHosts: redirects — when the redirect target host is also
        # allowlisted, the redirect IS followed and content is served.
        location /allowed-redirect-cdn/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_allowed_hosts "backend cdn.example.net";
            alias  /usr/share/nginx/html/;
            index  redirect_include.html;
        }

        # AllowedHosts: suffix-injection guard — example.com must NOT match
        # attacker-example.com or example.com.evil.com (no dot boundary).
        location /allowed-inject/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_allowed_hosts example.com;
            alias  /usr/share/nginx/html/;
            index  allowed_inject.html;
        }

        # Private-IP bypass for allowlisted hosts: directive on lets the
        # listed private backend through while block_private_ips stays on.
        location /bypass-on/ {
            enable_mesi on;
            mesi_block_private_ips on;
            mesi_allowed_hosts backend;
            mesi_allow_private_ips_for_allowed on;
            alias  /usr/share/nginx/html/;
            index  allowed.html;
        }

        # Private-IP bypass: default (off) — the allowlisted backend on a
        # private IP stays blocked.
        location /bypass-off/ {
            enable_mesi on;
            mesi_block_private_ips on;
            mesi_allowed_hosts backend;
            alias  /usr/share/nginx/html/;
            index  bypass_off.html;
        }

        # Private-IP bypass: directive on, but the private host is NOT in
        # allowed_hosts — still blocked (bypass never covers unlisted hosts).
        location /bypass-unlisted/ {
            enable_mesi on;
            mesi_block_private_ips on;
            mesi_allowed_hosts example.com;
            mesi_allow_private_ips_for_allowed on;
            alias  /usr/share/nginx/html/;
            index  bypass_unlisted.html;
        }

        # Max depth (#180): depth 1 fetches the outer include only; the
        # fragment is re-parsed with MaxDepth=0 so the inner tag is
        # replaced with the empty IncludeErrorMarker (never fetched).
        location /max-depth-1/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_depth 1;
            alias  /usr/share/nginx/html/;
            index  nested_depth.html;
        }

        # Max depth: explicit 5 = the same effective depth as the unset
        # default (both nest levels of /nested_depth.html are processed).
        location /max-depth-5/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_depth 5;
            alias  /usr/share/nginx/html/;
            index  nested_depth.html;
        }

        # Max depth: explicit 0 = "passthrough" (cross-platform contract,
        # Caddy README): NO <esi:include> is fetched and the tags are
        # stripped via the include-error path (empty default marker) —
        # they do NOT remain raw in the output.
        location /max-depth-0/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_depth 0;
            alias  /usr/share/nginx/html/;
            index  nested_depth.html;
        }

        # Max depth merge (#180): the parent sets 1, the nested child has
        # no directive — the child must inherit the parent's depth
        # (ngx_conf_merge_value) and behave like /max-depth-1/.
        location /max-depth-merge-inherit/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_depth 1;
            alias  /usr/share/nginx/html/;
            index  nested_depth.html;

            location /max-depth-merge-inherit/child/ {
                alias /usr/share/nginx/html/;
                index nested_depth.html;
            }
        }

        # Max depth merge: the parent sets 0 (passthrough), the nested
        # child sets 5 — the child's own value must win and both nest
        # levels are processed.
        location /max-depth-merge-override/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_depth 0;
            alias  /usr/share/nginx/html/;
            index  nested_depth.html;

            location /max-depth-merge-override/child/ {
                mesi_max_depth 5;
                alias /usr/share/nginx/html/;
                index nested_depth.html;
            }
        }

        # Timeout (#184): 2s budget aborts the backend's 5s include at
        # ~2s — the fragment renders as the empty IncludeErrorMarker,
        # the page chrome stays.
        location /timeout-2/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_timeout 2;
            alias  /usr/share/nginx/html/;
            index  timeout-2s.html;
        }

        # Timeout: explicit 30 (the same value as the unset default)
        # lets a 10s include through with the full budget to spare.
        location /timeout-30/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_timeout 30;
            alias  /usr/share/nginx/html/;
            index  timeout-30s.html;
        }

        # Timeout merge (#184): the parent sets 2, the nested child has
        # no directive — the child must inherit the parent's budget
        # (ngx_conf_merge_value over the unset sentinel) and abort the
        # 5s include like /timeout-2/.
        location /timeout-merge-inherit/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_timeout 2;
            alias  /usr/share/nginx/html/;
            index  timeout-2s.html;

            location /timeout-merge-inherit/child/ {
                alias /usr/share/nginx/html/;
                index timeout-2s.html;
            }
        }

        # Timeout merge: the parent sets 2 (5s include aborted), the
        # nested child sets 30 — the child's own value must win and the
        # same 5s include must arrive complete, while the parent keeps
        # aborting at 2s.
        location /timeout-merge-override/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_timeout 2;
            alias  /usr/share/nginx/html/;
            index  timeout-2s.html;

            location /timeout-merge-override/child/ {
                mesi_timeout 30;
                alias /usr/share/nginx/html/;
                index timeout-2s.html;
            }
        }

        # Max response size (#208): 100-byte cap — the 200-byte include
        # fails its fetch and renders the empty IncludeErrorMarker
        # (fail closed, never truncated).
        location /max-response-100/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_response_size 100;
            alias  /usr/share/nginx/html/;
            index  max_response_reject.html;
        }

        # Max response size: 1 MB cap — the 500 KB include arrives in
        # full (comfortable headroom under the cap).
        location /max-response-1m/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_response_size 1048576;
            alias  /usr/share/nginx/html/;
            index  max_response_accept.html;
        }

        # Max response size: explicit 0 = "unlimited" (the documented
        # core contract, mesi/fetch.go only limits when
        # MaxResponseSize > 0) — the 50 MB include arrives in full.
        location /max-response-0/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_response_size 0;
            alias  /usr/share/nginx/html/;
            index  max_response_unlimited.html;
        }

        # Max response size: unset — the legacy positional path leaves
        # MaxResponseSize at 0 (unlimited); the 10 MB + 1 byte include
        # must arrive, pinning "unset → unlimited, NO implicit 10 MB
        # default" (byte-identical to pre-#208 behaviour).
        location /max-response-unset/ {
            enable_mesi on;
            mesi_block_private_ips off;
            alias  /usr/share/nginx/html/;
            index  max_response_unset.html;
        }

        # Max response size merge (#208): the parent sets 100, the
        # nested child has no directive — the child must inherit 100
        # through ngx_conf_merge_off_value over the unset sentinel (the
        # 200-byte include is rejected on both the parent URL and the
        # child URL).
        location /max-response-merge-inherit/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_response_size 100;
            alias  /usr/share/nginx/html/;
            index  max_response_merge.html;

            location /max-response-merge-inherit/child/ {
                alias /usr/share/nginx/html/;
                index max_response_merge.html;
            }
        }

        # Max response size merge: the parent sets 100 (200-byte
        # include rejected), the nested child sets 0 — the child's own
        # value must win and the same include must arrive in full
        # (proves 0 survives the merge as a STORED value, not collapsed
        # to unset or to the parent's 100 — the -1-sentinel rule),
        # while the parent keeps rejecting.
        location /max-response-merge-override/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_response_size 100;
            alias  /usr/share/nginx/html/;
            index  max_response_merge.html;

            location /max-response-merge-override/child/ {
                mesi_max_response_size 0;
                alias /usr/share/nginx/html/;
                index max_response_merge.html;
            }
        }

        # Control plane for the peak-concurrency tracker (#214): lets
        # test.sh reset and read the backend's /hold in-flight gauge
        # without a host port mapping on the backend service (mirrors
        # Apache's /backend/ ProxyPass of #170). No enable_mesi here
        # (plain proxy passthrough) and no mesi directives.
        location /track/ {
            proxy_pass http://backend:8000;
        }

        # Max concurrent requests (#214): cap 3 — the 20 slow /hold
        # includes of concurrent_capped.html must be funneled through
        # 3 concurrent fetch slots (peak observed by the backend
        # /hold gauge via /track/max). No mesi_cache_backend here:
        # the process-wide shared cache would absorb repeat fetches
        # and mask the semaphore.
        location /mcr-3/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_concurrent_requests 3;
            alias  /usr/share/nginx/html/;
            index  concurrent_capped.html;
        }

        # Max concurrent requests: explicit 0 = "unlimited" (the
        # documented core contract — the admission semaphore is only
        # installed when the value is > 0, mesi/parser.go) — the 20
        # includes fan out unthrottled.
        location /mcr-0/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_concurrent_requests 0;
            alias  /usr/share/nginx/html/;
            index  concurrent_unlimited.html;
        }

        # Max concurrent requests: unset — the legacy positional path
        # leaves MaxConcurrentRequests at 0 (unlimited), pinning
        # "unset → unlimited" byte-identical to pre-#214 behaviour.
        location /mcr-unset/ {
            enable_mesi on;
            mesi_block_private_ips off;
            alias  /usr/share/nginx/html/;
            index  concurrent_unset.html;
        }

        # Max concurrent requests merge (#214): the parent sets 3, the
        # nested child has no directive — the child must inherit 3
        # through ngx_conf_merge_value over the unset sentinel (peak
        # <= 3 on BOTH the parent and the child URL). Each location
        # serves its own fixture so the two runs use disjoint backend
        # label sets — the process-wide shared cache would otherwise
        # serve the second run entirely from cache and mask a lost cap.
        location /mcr-merge-inherit/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_concurrent_requests 3;
            alias  /usr/share/nginx/html/;
            index  concurrent_merge_inherit_parent.html;

            location /mcr-merge-inherit/child/ {
                alias /usr/share/nginx/html/;
                index concurrent_merge_inherit_child.html;
            }
        }

        # Max concurrent requests merge: the parent sets 3 (peak <= 3),
        # the nested child sets 0 — the child's own value must win and
        # fan out unthrottled (peak >= 4; proves 0 survives the merge
        # as a STORED value, the -1-sentinel rule), while the parent
        # keeps capping.
        location /mcr-merge-override/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_concurrent_requests 3;
            alias  /usr/share/nginx/html/;
            index  concurrent_merge_override_parent.html;

            location /mcr-merge-override/child/ {
                mesi_max_concurrent_requests 0;
                alias /usr/share/nginx/html/;
                index concurrent_merge_override_child.html;
            }
        }

        # Max concurrent requests stress (#214): explicit 0 (max
        # fan-out) — test.sh renders this page from 10 parallel curl
        # requests (the issue's ab -n 100 -c 10 AC; ab is not in the
        # test image), exercising ~200 backend fetches in a few
        # seconds without fd exhaustion or a hang. Own fixture so the
        # shared cache cannot absorb the fetches.
        location /mcr-stress/ {
            enable_mesi on;
            mesi_block_private_ips off;
            mesi_max_concurrent_requests 0;
            alias  /usr/share/nginx/html/;
            index  concurrent_stress.html;
        }
    }
}
