http:
  routers:
    test-server:
      middlewares:
        - mesi
      entrypoints:
        - http
      service: test-server
      rule: Host(`domain.com`)

    # Timeout fixtures (#187): same backend, one budget middleware each.
    timeout2:
      middlewares:
        - mesi-timeout-2
      entrypoints:
        - http
      service: test-server
      rule: Host(`timeout2.domain.com`)

    timeout30:
      middlewares:
        - mesi-timeout-30
      entrypoints:
        - http
      service: test-server
      rule: Host(`timeout30.domain.com`)

    # Max response size fixtures (#210): same backend, one cap
    # middleware each. The absent case rides the default `mesi`
    # middleware on `domain.com` (byte-compatible with pre-#210
    # behaviour).
    maxrs100:
      middlewares:
        - mesi-maxrs-100
      entrypoints:
        - http
      service: test-server
      rule: Host(`maxrs100.domain.com`)

    maxrs1m:
      middlewares:
        - mesi-maxrs-1m
      entrypoints:
        - http
      service: test-server
      rule: Host(`maxrs1m.domain.com`)

  services:
    test-server:
      loadBalancer:
        servers:
          - url: http://test-server:80
        passHostHeader: false

  middlewares:
    mesi:
      plugin:
        mesi: {}

    mesi-timeout-2:
      plugin:
        mesi:
          timeout: "2s"

    mesi-timeout-30:
      plugin:
        mesi:
          timeout: "30s"

    mesi-maxrs-100:
      plugin:
        mesi:
          maxResponseSize: 100

    mesi-maxrs-1m:
      plugin:
        mesi:
          maxResponseSize: 1048576
