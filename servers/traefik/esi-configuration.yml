http:
  routers:
    test-server:
      middlewares:
        - mesi
      entrypoints:
        - http
      service: test-server
      rule: Host(`domain.com`)

    # Timeout fixtures (#187): same backend, one budget middleware each.
    timeout2:
      middlewares:
        - mesi-timeout-2
      entrypoints:
        - http
      service: test-server
      rule: Host(`timeout2.domain.com`)

    timeout30:
      middlewares:
        - mesi-timeout-30
      entrypoints:
        - http
      service: test-server
      rule: Host(`timeout30.domain.com`)

    # Max response size fixtures (#210): same backend, one cap
    # middleware each. The absent case rides the default `mesi`
    # middleware on `domain.com` (byte-compatible with pre-#210
    # behaviour).
    maxrs100:
      middlewares:
        - mesi-maxrs-100
      entrypoints:
        - http
      service: test-server
      rule: Host(`maxrs100.domain.com`)

    maxrs1m:
      middlewares:
        - mesi-maxrs-1m
      entrypoints:
        - http
      service: test-server
      rule: Host(`maxrs1m.domain.com`)

    # Max concurrent requests fixtures (#215): same backend, one cap
    # middleware each. The absent case rides the default `mesi`
    # middleware on `domain.com` (byte-compatible with pre-#215
    # behaviour). No cacheBackend anywhere: traefik caching is opt-in
    # (CreateConfig() never seeds cacheBackend), and the 20 distinct
    # /hold/HOLDFRAG-{i} include URLs of the funnel fixture must all
    # reach the backend's peak gauge un-deduped.
    mcr3:
      middlewares:
        - mesi-mcr-3
      entrypoints:
        - http
      service: test-server
      rule: Host(`mcr3.domain.com`)

    mcr0:
      middlewares:
        - mesi-mcr-0
      entrypoints:
        - http
      service: test-server
      rule: Host(`mcr0.domain.com`)

    # Max workers fixtures (#220): same deep-nesting chain, differing
    # only in their per-parse drain-pool cap. The absent case rides mesi.
    maxworkers2:
      middlewares:
        - mesi-maxworkers-2
      entrypoints:
        - http
      service: test-server
      rule: Host(`maxworkers2.domain.com`)

    maxworkers100:
      middlewares:
        - mesi-maxworkers-100
      entrypoints:
        - http
      service: test-server
      rule: Host(`maxworkers100.domain.com`)

  services:
    test-server:
      loadBalancer:
        servers:
          - url: http://test-server:80
        passHostHeader: false

  middlewares:
    mesi:
      plugin:
        mesi: {}

    mesi-timeout-2:
      plugin:
        mesi:
          timeout: "2s"

    mesi-timeout-30:
      plugin:
        mesi:
          timeout: "30s"

    mesi-maxrs-100:
      plugin:
        mesi:
          maxResponseSize: 100

    mesi-maxrs-1m:
      plugin:
        mesi:
          maxResponseSize: 1048576

    mesi-mcr-3:
      plugin:
        mesi:
          maxConcurrentRequests: 3

    # Explicit "unlimited" — same as omitting the option, stated on
    # purpose (#215): 0 must reach the core as the documented
    # "unlimited" (no admission semaphore installed).
    mesi-mcr-0:
      plugin:
        mesi:
          maxConcurrentRequests: 0

    mesi-maxworkers-2:
      plugin:
        mesi:
          maxWorkers: 2

    mesi-maxworkers-100:
      plugin:
        mesi:
          maxWorkers: 100
