LoadModule mesi_module /usr/lib/apache2/modules/mod_mesi.so

# Extra listeners for the SSRF bypass (#168) + cache key template (#177):
# 8081 = MesiAllowPrivateIPsForAllowedHosts On, 8082 = Off.
Listen 8081
Listen 8082
# 8083 = MesiSharedHTTPClient On (connection pooling across includes, #178).
Listen 8083
Listen 8084
# 8085 = MesiMaxDepth 1 (inner tag stripped / not fetched), 8086 = MesiMaxDepth 5.
Listen 8085
Listen 8086
# 8087 = MesiTimeout 2 (slow include aborted at ~2s), 8088 = MesiTimeout 30
# (10s include succeeds); the default *:80 vhost leaves MesiTimeout unset
# (→ 30s). Used by test.sh (#167).
Listen 8087
Listen 8088
# 8089 = MesiMaxResponseSize 100 (200-byte include rejected), 8090 =
# MesiMaxResponseSize 1048576 (500 KB include succeeds), 8091 =
# MesiMaxResponseSize 0 (unlimited: 50 MB include succeeds); the default
# *:80 vhost leaves MesiMaxResponseSize unset (→ unlimited, backward
# compat — a 10 MB + 1 include must still succeed). Used by test.sh (#169).
Listen 8089
Listen 8090
Listen 8091
# 8092 = MesiMaxConcurrentRequests 3 (20 slow includes funneled through
# 3 concurrent fetch slots), 8093 = MesiMaxConcurrentRequests 0
# (explicit unlimited); the default *:80 vhost leaves
# MesiMaxConcurrentRequests unset (→ unlimited, backward compat).
# Used by test.sh (#170).
Listen 8092
Listen 8093
# 8094 = MesiMaxWorkers 2 (4-level deep-nesting stress completes; 20
# slow includes drain through a 2-goroutine worker pool — backend
# peak <= 2), 8095 = MesiMaxWorkers 0 (explicit library default
# NumCPU*4); the default *:80 vhost leaves MesiMaxWorkers unset
# (→ library default, backward compat). Used by test.sh (#171).
Listen 8094
Listen 8095
# 8096 = MesiMaxBodySize 2000 (pass), 8097 = MesiMaxBodySize 2000 +
# MesiOnOversize error. Used by test.sh.
Listen 8096
Listen 8097
# 8098 = MesiDebug On (parser DEBUG lines land in error.log), 8099 =
# MesiDebug Off (explicitly silent); the default *:80 vhost leaves
# MesiDebug unset (→ off). Used by test.sh (#173).
# 8100 = MesiParseOnHeader On, 8101 = MesiParseOnHeader Off, 8102 =
# MesiParseOnHeader On + MesiMaxBodySize 2000 + MesiOnOversize error;
# the default *:80 vhost leaves MesiParseOnHeader unset (→ off, always
# parse). Used by test.sh (#172).
# 8103 = MesiIncludeErrorMarker configured on the vhost with a marker
# distinct from the global one below (failed includes render it instead
# of disappearing), 8104 = a vhost that sets no marker and therefore
# inherits the global one. The default *:80 vhost clears the inherited
# global marker with an explicit empty value. Used by test.sh (#165).
Listen 8098
Listen 8099
Listen 8100
Listen 8101
Listen 8102
Listen 8103
Listen 8104

LogLevel debug

EnableMesi on
MesiAllowedHosts backend raw.githubusercontent.com
MesiBlockPrivateIPs Off
# Global include-error marker inherited by every vhost that does not set
# its own. The directive parses exactly one Apache config token, so a
# marker containing spaces must be quoted; `MesiIncludeErrorMarker ""`
# is an explicit empty value that clears the inherited marker (#165).
MesiIncludeErrorMarker "<!-- ESI include failed -->"
# Memory cache wired into the same process as the filter so duplicate
# <esi:include> URLs declared within TTL are served from libgomesi's
# in-memory cache. Backend must be one of "memory", "redis", or
# "memcached" — any other value errors out so a typo never silently
# disables caching.
MesiCacheBackend memory
MesiCacheSize 1000
MesiCacheTTL 60
# To switch to Redis instead, replace the block above with:
# MesiCacheBackend redis
# MesiCacheRedisAddr 10.0.0.5:6379
# MesiCacheRedisPassword secret
# MesiCacheRedisDB 0
# MesiCacheTTL 60
# To switch to Memcached instead, replace the block above with:
# MesiCacheBackend memcached
# MesiCacheMemcachedServers 10.0.0.1:11211 10.0.0.2:11211
# MesiCacheTTL 60

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/
    # Chunked streaming backend (#98): server.py also listens on 8001
    # with HTTP/1.1, so this path exercises a real
    # `Transfer-Encoding: chunked` upstream. The main backend stays
    # HTTP/1.0 because the body-limit tests rely on length-less
    # responses delimited by connection close.
    ProxyPass /chunked/ http://backend:8001/
    ProxyPassReverse /chunked/ http://backend:8001/

    # Explicit empty clears the global marker inherited above: failed
    # includes on this vhost stay silent (the pre-#165 behaviour).
    MesiIncludeErrorMarker ""

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# SSRF bypass-on host: BlockPrivateIPs On + AllowedHosts backend +
# AllowPrivateIPsForAllowedHosts On. Includes to backend (a private
# docker IP) must succeed; includes to hosts outside AllowedHosts must
# still be blocked. Used by test.sh (#168).
<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs On
    MesiAllowPrivateIPsForAllowedHosts On

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# SSRF bypass-off host: identical to 8081 but AllowPrivateIPsForAllowedHosts
# left at its default (Off). Includes to backend (private IP) must be
# blocked by BlockPrivateIPs. Used by test.sh (#168).
<VirtualHost *:8082>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs On

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Shared HTTP client host: MesiSharedHTTPClient On enables a single pooled
# http.Client across all <esi:include> fetches in the worker process.
# Includes to backend must still resolve (backward compat) and the
# "mesi: shared HTTP client initialized" NOTICE log must appear, proving
# libgomesi InitHTTPClient was wired. Used by test.sh (#178).
<VirtualHost *:8083>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiSharedHTTPClient On

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
# Cache key template host: MesiCacheKeyTemplate varies keys by
# Accept-Language. Used by test.sh (#177) to prove header-based isolation.
<VirtualHost *:8084>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiCacheBackend memory
    MesiCacheSize 1000
    MesiCacheTTL 60
    MesiCacheKeyTemplate "mesi:$${url}:${header:Accept-Language}"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-depth=1 host: processes one include level so /nested.html fetches
# nested.txt, then re-parses it with MaxDepth=0 (ParseOnly). The inner
# <esi:include> is replaced with the explicitly empty IncludeErrorMarker
# — not left in the HTML. Used by test.sh (#166). Does not change the
# default *:80 vhost (unset → 5).
<VirtualHost *:8085>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxDepth 1
    MesiIncludeErrorMarker ""

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-depth=5 host: both nest levels of /nested.html are processed
# (same effective depth as the unset default). Used by test.sh (#166).
<VirtualHost *:8086>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxDepth 5

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Timeout=2s host: an <esi:include> whose backend sleeps 5s must be
# aborted at ~2s (explicitly empty IncludeErrorMarker — no fragment
# body, no raw tag left behind). Used by test.sh (#167). Does not change
# the default *:80 vhost (unset → 30s).
<VirtualHost *:8087>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiTimeout 2
    MesiIncludeErrorMarker ""

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Timeout=30s host: an <esi:include> whose backend responds after 10s
# must succeed with its full fragment. Used by test.sh (#167).
<VirtualHost *:8088>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiTimeout 30

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-response-size=100 host: an <esi:include> whose backend returns a
# 200-byte body must be rejected by the size check (explicitly empty
# IncludeErrorMarker, no raw tag). Used by test.sh (#169).
<VirtualHost *:8089>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxResponseSize 100
    MesiIncludeErrorMarker ""

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-response-size=1 MB host: an <esi:include> whose backend returns a
# 500 KB body must succeed with the full fragment. Used by test.sh (#169).
<VirtualHost *:8090>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxResponseSize 1048576

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-response-size=0 host: explicit "unlimited" — a 50 MB include must
# succeed (pins "0 = unlimited" functionally; the -1-sentinel merge — 0
# stored as configured, not as unset — is pinned by the
# merge_mrs_child_zero_overrides unit test in test_directives.c, since
# no global limit is configured here to make the two cases differ).
# Used by test.sh (#169).
<VirtualHost *:8091>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxResponseSize 0

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-concurrent-requests=3 host: 20 slow includes (/hold/1500/*) must
# be funneled through 3 concurrent fetch slots — the backend's peak
# counter stays <= 3 while every fragment still arrives (queued beyond
# the cap, not dropped). This is also the routing proof that a config
# setting ONLY MesiMaxConcurrentRequests goes through ParseJson (the
# timeout/max-response-size keys stay absent → their defaults).
# Used by test.sh (#170). Does not change the default *:80 vhost
# (unset → unlimited).
<VirtualHost *:8092>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxConcurrentRequests 3

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-concurrent-requests=0 host: explicit "unlimited" — 20 slow
# includes must fan out unthrottled (pins "0 = unlimited" through the
# ParseJson "maxConcurrentRequests":0 key; the -1-sentinel merge — 0
# stored as configured, not as unset — is pinned by the
# merge_mcr_child_zero_overrides unit test in test_directives.c, since
# no global cap is configured here to make the two cases differ).
# Used by test.sh (#170).
<VirtualHost *:8093>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxConcurrentRequests 0

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-workers=2 host: the drain pool of every parse level is capped at
# 2 goroutines — /max-workers-deep.html must expand its four-level
# nested chain completely (the issue's AC stress case), and
# /max-workers-pool.html's 20 slow includes must show backend peak
# concurrency <= 2 while every fragment still arrives (drained in
# batches of 2, not dropped). This is also the routing proof that a
# config setting ONLY MesiMaxWorkers goes through ParseJson (the
# timeout/max-response-size/max-concurrent-requests keys stay absent
# → their defaults). Used by test.sh (#171). Does not change the
# default *:80 vhost (unset → library default NumCPU*4).
<VirtualHost *:8094>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxWorkers 2

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Max-workers=0 host: explicit "library default" (NumCPU*4) — 20 slow
# includes must fan out unthrottled (pins "0 = library default"
# through the ParseJson "maxWorkers":0 key; the -1-sentinel merge — 0
# stored as configured, not as unset — is pinned by the
# merge_mw_child_zero_overrides unit test in test_directives.c, since
# no global cap is configured here to make the two cases differ).
# Used by test.sh (#171).
<VirtualHost *:8095>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxWorkers 0

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# MesiMaxBodySize 2000 host, default MesiOnOversize (pass): a body over
# the limit is sent unprocessed. Used by test.sh.
<VirtualHost *:8096>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxBodySize 2000
    ProxyPass /backend/ http://backend:8000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# MesiMaxBodySize 2000 with MesiOnOversize error: a body over the limit
# is answered with 502. Used by test.sh.
<VirtualHost *:8097>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiMaxBodySize 2000
    ProxyPass /backend/ http://backend:8000/
    MesiOnOversize error

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Debug On host: the Go parser emits DEBUG lines to stderr, which Apache
# captures in error.log. A failed include must surface include_failed and
# the 404 fetch detail. Used by test.sh (#173).
<VirtualHost *:8098>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiDebug On

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Debug Off host: explicit Off must stay silent even though the global
# default is also silent. Used by test.sh (#173) to pin that the parser
# produces no DEBUG output.
<VirtualHost *:8099>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiDebug Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Parse-on-header On host: an HTML response is buffered and parsed only
# when its upstream `Edge-control` header carries `dca=esi`; every other
# HTML response is streamed through unchanged (no buffering, no
# Surrogate-Capability, no ESI processing). Non-HTML is unaffected.
# Used by test.sh (#172).
<VirtualHost *:8100>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiParseOnHeader On

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Parse-on-header Off host: explicit Off must always parse HTML even
# when the response has no Edge-control header. Used by test.sh (#172).
<VirtualHost *:8101>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiParseOnHeader Off

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Parse-on-header On with a small body cap: the unsignalled streamed page
# must pass through untouched (the filter exits before buffering, so
# MesiMaxBodySize does not apply), while the same signalled page is
# buffered and answered 502 by MesiOnOversize error. Used by test.sh
# (#172) as the "no buffering of unsignalled pages" assertion.
<VirtualHost *:8102>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiParseOnHeader On
    MesiMaxBodySize 2000
    MesiOnOversize error

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Include-error-marker override host: a failed <esi:include> with no
# onerror="continue" and no fallback body renders the vhost's marker
# instead of disappearing. onerror/fallback still take priority. The
# marker deliberately differs from the global one, so this vhost pins
# the per-vhost override path rather than an accidental inherit. Used by
# test.sh (#165).
<VirtualHost *:8103>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off
    MesiIncludeErrorMarker "<!-- vhost ESI include failed -->"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Include-error-marker inheritance host: no MesiIncludeErrorMarker of its
# own, so the global marker applies (NULL merge = inherit). Used by
# test.sh (#165).
<VirtualHost *:8104>
    ServerName localhost
    DocumentRoot /var/www/html

    EnableMesi on
    MesiAllowedHosts backend
    MesiBlockPrivateIPs Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
