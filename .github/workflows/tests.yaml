name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for committed generated artifacts
        run: ./scripts/check-no-generated-artifacts.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build libgomesi
        run: cd libgomesi && go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o libgomesi.so libgomesi.go cache_config.go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          only-new-issues: false
          skip-cache: true
          args: ./mesi/...

      - name: Download CLI dependencies
        run: cd cli && go mod download

      - name: Run golangci-lint (cli)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          only-new-issues: false
          skip-cache: true
          working-directory: cli
          args: ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./mesi/...

  apache-test:
    name: Apache Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build libgomesi
        run: cd libgomesi && go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o libgomesi.so libgomesi.go cache_config.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Apache Docker image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/apache/Dockerfile
          push: false
          load: true
          tags: go-mesi-apache-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Apache tests
        run: cd servers/apache && ./test.sh

      - name: Cleanup
        if: always()
        run: cd servers/apache && docker compose down -v 2>/dev/null || true

  yaegi-check:
    name: Yaegi Compatibility
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Yaegi compatibility test
        working-directory: servers/traefik
        run: go test -run TestYaegiCompatibility -v -count=1 .

  traefik-test:
    name: Traefik Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test, yaegi-check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Traefik Docker image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/traefik/Dockerfile
          push: false
          load: true
          tags: go-mesi-traefik-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Traefik tests
        run: cd servers/traefik && ./test.sh

      - name: Cleanup
        if: always()
        run: cd servers/traefik && docker compose down -v 2>/dev/null || true

  cli-test:
    name: CLI Unit Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download CLI dependencies
        run: cd cli && go mod download

      - name: Run CLI unit tests
        run: cd cli && go test -v -count=1 ./...

  cli-e2e-test:
    name: CLI E2E Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download CLI dependencies
        run: cd cli && go mod download

      - name: Run CLI E2E tests
        run: cd cli && bash test.sh

      - name: Cleanup
        if: always()
        run: pkill -9 mesi-test-server 2>/dev/null || true

  proxy-test:
    name: Proxy Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download proxy dependencies
        run: cd servers/proxy && go mod download

      - name: Run proxy unit tests
        run: cd servers/proxy && go test -v -count=1 ./...

      - name: Run proxy E2E tests
        run: cd servers/proxy && bash test.sh

      - name: Cleanup
        if: always()
        run: pkill -9 mesi-proxy-test 2>/dev/null || true; pkill -9 mesi-test-server 2>/dev/null || true

  nginx-test:
    name: Nginx Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build libgomesi
        run: cd libgomesi && go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o libgomesi.so libgomesi.go cache_config.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Nginx Docker image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/nginx/Dockerfile
          push: false
          load: true
          tags: go-mesi-nginx-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Nginx tests
        run: cd servers/nginx && ./test.sh

      - name: Cleanup
        if: always()
        run: cd servers/nginx && docker compose down -v 2>/dev/null || true

  caddy-test:
    name: Caddy Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Caddy tests
        run: cd servers/caddy && ./test.sh

      - name: Cleanup
        if: always()
        run: cd servers/caddy && docker compose down -v 2>/dev/null || true

  frankenphp-test:
    name: FrankenPHP Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run FrankenPHP tests
        run: cd servers/frankenphp && ./test.sh

      - name: Cleanup
        if: always()
        run: cd servers/frankenphp && docker compose down -v 2>/dev/null || true

  roadrunner-test:
    name: RoadRunner Integration Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download roadrunner dependencies
        run: cd servers/roadrunner && go mod download

      - name: Run RoadRunner tests
        run: cd servers/roadrunner && bash test.sh

      - name: Cleanup
        if: always()
        run: pkill -9 rrtest 2>/dev/null || true; pkill -9 test-server 2>/dev/null || true

  php-ext-test:
    name: PHP Extension Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build libgomesi
        run: cd libgomesi && go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o libgomesi.so libgomesi.go cache_config.go

      - name: Setup PHP with dev tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: phpize

      - name: Build PHP extension
        run: |
          cd php-ext
          phpize
          ./configure --with-gomesi=../libgomesi
          make -f Makefile
          sudo make -f Makefile install

      - name: Run extension unit tests
        run: |
          echo "=== Extension loaded ==="
          php -d extension=mesi -m | grep mesi
          echo "=== Basic functionality test ==="
          php -d extension=mesi -r '
            $result = \mesi\parse("<!--esi Hello, world!-->", 5, "http://localhost/");
            assert(trim($result) === "Hello, world!", "Basic unwrap failed: " . $result);
            echo "PASS: Basic ESI comment unwrap\n";
          '
          echo "=== ESI remove test ==="
          php -d extension=mesi -r '
            $result = \mesi\parse("<p>keep</p><esi:remove>drop</esi:remove>", 5, "http://localhost/");
            assert($result === "<p>keep</p>", "ESI remove failed: " . $result);
            echo "PASS: ESI remove\n";
          '
          echo "=== Empty input test ==="
          php -d extension=mesi -r '
            $result = \mesi\parse("", 5, "http://localhost/");
            assert($result === "", "Empty input failed");
            echo "PASS: Empty input\n";
          '
          echo "=== Plain HTML passthrough test ==="
          php -d extension=mesi -r '
            $input = "<html><body><p>plain</p></body></html>";
            $result = \mesi\parse($input, 5, "http://localhost/");
            assert($result === $input, "Plain HTML passthrough failed");
            echo "PASS: Plain HTML passthrough\n";
          '
          echo "=== UTF-8 test ==="
          php -d extension=mesi -r '
            $result = \mesi\parse("<!--esi Café français ✓-->", 5, "http://localhost/");
            echo "PASS: UTF-8 output: [" . trim($result) . "]\n";
          '

      - name: Build test-server
        run: |
          cd servers/test-server && go build -o test-server test-server.go

      - name: Run integration tests
        run: |
          MESI_TEST_SERVER_PORT=8081 ./servers/test-server/test-server &
          TS_PID=$!
          echo "test-server PID: $TS_PID"
          for i in $(seq 1 10); do
            if curl -s -o /dev/null http://localhost:8081/; then
              echo "test-server ready after ${i}s"
              break
            fi
            sleep 1
          done
          export MESI_BACKEND_URL='http://localhost:8081/'
          php -d extension=mesi -S 0.0.0.0:8080 php-ext/tests/router.php > /dev/null 2>&1 &
          PHP_PID=$!
          echo "PHP server PID: $PHP_PID"
          sleep 2
          cd php-ext && bash test.sh

      - name: Cleanup
        if: always()
        run: pkill -9 test-server 2>/dev/null || true; pkill -f "php -S 0.0.0.0:8080" 2>/dev/null || true

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, test, apache-test, yaegi-check, traefik-test, cli-test, cli-e2e-test, proxy-test, nginx-test, caddy-test, frankenphp-test, roadrunner-test, php-ext-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
