# hadolint configuration, used by bin/lint.sh.
#
# The Dockerfiles in this repository are test and build images, not
# production images. The rules below are ignored for all of them because
# they match many lines and fixing them would change images that only the
# Docker integration suites exercise. Fixing them is a follow-up; every
# other rule stays active. One-off cases use inline `# hadolint ignore=`.
ignored:
  # Pinning apt/apk packages and `go install` versions: test images track
  # the distribution; pinning needs a refresh process first.
  # servers/frankenphp/Dockerfile is the deliberate exception: its build
  # dependency decides how the image is built, not which distribution it runs
  # on, so it is pinned there and checked by scripts/check-docker-build-pins.sh.
  - DL3008
  - DL3018
  - DL3062
  # `cd` in a RUN chain instead of WORKDIR; the chains are multi-step builds.
  - DL3003
  # Style: no-install-recommends and wget progress output in test images.
  - DL3015
  - DL3047
