# Apache MesiMaxConcurrentRequests Configuration Example (#170)
#
# Caps the number of concurrent <esi:include> HTTP fetches within one
# page render. Scope: one MESIParse call — a single page render in one
# Apache worker thread/process, NOT process-wide or vhost-wide:
# multiple concurrent page requests each get their own worker pool and
# semaphore, and under MPM worker/event each thread applies the limit
# independently. Includes queued beyond the cap wait for a free slot
# (bounded by the fetch budget — the MesiTimeout deadline covers the
# admission wait); they are never dropped.
#
# Unset → unlimited: libgomesi leaves EsiParserConfig.MaxConcurrentRequests
# at 0, which the core treats as "no limit" (mesi/parser.go only installs
# the admission-control semaphore when > 0), so omitting the directive is
# byte-identical to pre-#170 behaviour (same contract as the core's
# "0 = unlimited" and Caddy's unset max_concurrent_requests). Explicit 0 =
# unlimited as well (a legitimate configured value that overrides an
# inherited cap). Range [0, 999999999]: neither core nor Caddy caps the
# value — the bound is the portable transport range (C `int` +
# parse_nonneg_int's 9-digit guard), kept in sync with libgomesi's
# config.MaxMaxConcurrentRequests — see docs/features.md. Invalid values
# (negative, sign, decimal, non-integer, empty, above the cap) fail
# `apachectl configtest` at load — parsed by the strict parse_nonneg_int
# helper, never a silent atoi coercion (the issue's atoi sketch is
# superseded: it would turn "abc"/"" into 0 = unlimited and accept
# trailing garbage like "3foo"). A negative must never reach the core,
# which (since #329) only warns and normalizes it to 0 = unlimited.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore
#     MesiMaxConcurrentRequests with a logged warning and keep
#     unlimited)
#
# Usage:
#   Directives are server-context (RSRC_CONF): set globally and/or per
#   <VirtualHost>. A vhost's value overrides the global one; vhosts
#   without the directive inherit the global value (unset + unset →
#   unlimited).

# Global default for every vhost that does not set its own value.
EnableMesi On
MesiMaxConcurrentRequests 10

<VirtualHost *:8080>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Fan-out cap: this vhost OVERRIDES the global 10. A page with 20
    # <esi:include> tags fetches through at most 3 concurrent slots —
    # protects file descriptors and the upstream backend from an
    # include-heavy page stampeding it with simultaneous requests.
    MesiMaxConcurrentRequests 3
</VirtualHost>

<VirtualHost *:8081>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Explicit "unlimited": OVERRIDES the global 10 cap above (the -1
    # unset sentinel makes a stored 0 distinguishable from "inherit").
    MesiMaxConcurrentRequests 0
</VirtualHost>

# The following are config-load ERRORS (apachectl configtest fails):
#   MesiMaxConcurrentRequests -1        # negative (core would warn+normalize to unlimited)
#   MesiMaxConcurrentRequests +3        # non-canonical sign
#   MesiMaxConcurrentRequests 2.5       # decimal
#   MesiMaxConcurrentRequests abc       # non-integer (atoi would silently mean unlimited)
#   MesiMaxConcurrentRequests 3foo      # trailing garbage (atoi would silently accept 3)
#   MesiMaxConcurrentRequests 1000000000  # above the 999999999 cap
