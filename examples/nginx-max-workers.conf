# Nginx mesi_max_workers Configuration Example (#219)
#
# Caps the size of the token-processing drain pool that processes
# <esi:include> ESI jobs during a single ESI parse. Scope: one
# MESIParse call — one nesting level of one page render, NOT
# worker-global or vhost-wide: each nested parse spawns its own pool
# and inherits the cap, each concurrent request's own parse builds its
# own pool (4 workers x cap 8 -> up to 32 token-processing
# goroutines). The core spawns min(MaxWorkers, job count) goroutines
# (mesi/parser.go) and each processes one include at a time.
#
# Distinction from mesi_max_concurrent_requests (#214): that directive
# bounds concurrent <esi:include> HTTP fetches (an admission semaphore
# — connection fan-out against the backend); mesi_max_workers bounds
# the CPU-side goroutine pool that processes tokens/includes — on a
# flat page the pool also caps fetch concurrency at that level, but it
# additionally bounds token-processing work (CPU-intensive
# include-tree traversal on deeply nested pages; mesi_max_workers 1
# serializes token processing — useful for debugging).
#
# Unset -> library default runtime.NumCPU()*4: libgomesi leaves
# EsiParserConfig.MaxWorkers at 0, which the core replaces with
# NumCPU*4 for any value <= 0 (mesi/parser.go), so omitting the
# directive is byte-identical to pre-#219 behaviour (same contract as
# the core's "Zero means runtime.NumCPU()*4" and Caddy's unset
# max_workers). Explicit 0 = the same "library default" (a
# legitimate configured value that overrides an inherited cap; sent as
# {"maxWorkers":0} through ParseJson, matching Apache #171 / php-ext
# #211). Range [0, 999999999]: neither core nor Caddy caps the value
# (Caddy's bare strconv.Atoi accepts negatives and unbounded values —
# the #452-tracked gap family, not inherited here) — the bound is the
# portable transport range (C `int` + the shared 9-digit strict
# parsers), kept in sync with libgomesi's config.MaxMaxWorkers /
# Apache MESI_MAX_MAX_WORKERS — see docs/features.md. Invalid values
# (negative, sign, decimal, non-integer, empty, above the cap) fail
# `nginx -t` at load — parsed by a custom setter (mirroring
# mesi_max_depth / mesi_timeout / mesi_max_response_size /
# mesi_max_concurrent_requests), never a silent coercion (the issue's
# ngx_conf_set_num_slot sketch is superseded: ngx_atoi has no upper
# bound). A negative must never reach the core, which substitutes the
# default for any <= 0 SILENTLY, with no warning at all (the open
# #456 — nginx rejects negatives at config load instead of feeding
# that substitution).
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore
#     mesi_max_workers with a logged warning and keep the library
#     default NumCPU*4 pool)
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.
#   mesi_max_workers is location-scoped; nested locations inherit the
#   enclosing location's value unless they set their own (an explicit
#   0 in a child overrides an inherited cap — the unset sentinel is
#   -1, not 0).

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # CPU-lean: never more than 4 token-processing goroutines per
    # parse — bounds Go-level CPU usage on shared infrastructure (the
    # issue's motivation: a 64-core machine defaults to 256
    # goroutines).
    location /cpu-lean/ {
        enable_mesi on;
        mesi_max_workers 4;
        proxy_pass http://backend;

        # Nested locations inherit the enclosing location's value
        # (ngx_conf_merge_value): this child is also capped at 4.
        location /cpu-lean/fragments/ {
            proxy_pass http://backend;
        }
    }

    # Debugging: serialize token processing (single goroutine) to make
    # rendering order deterministic — useful when chasing cache or
    # ordering issues. Not recommended for production.
    location /debug-serial/ {
        enable_mesi on;
        mesi_max_workers 1;
        proxy_pass http://backend;
    }

    # A nested location can also override an inherited cap — explicit 0
    # is the documented "library default" (NumCPU*4) value and OVERRIDES
    # the parent's 2 (the sentinel being -1 is what keeps "0 configured"
    # distinguishable from "unset").
    location /mixed/ {
        enable_mesi on;
        mesi_max_workers 2;
        proxy_pass http://backend;

        location /mixed/unthrottled/ {
            mesi_max_workers 0;   # overrides the parent's 2
            proxy_pass http://backend;
        }
    }

    # Omit mesi_max_workers entirely to keep the library default
    # runtime.NumCPU()*4 (the byte-identical legacy path).
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}

# The following are config-load ERRORS (`nginx -t` fails):
#   mesi_max_workers -1;          # negative (core would substitute NumCPU*4 SILENTLY, #456)
#   mesi_max_workers +4;          # non-canonical sign
#   mesi_max_workers 2.5;         # decimal
#   mesi_max_workers abc;         # non-integer (atoi would silently mean library default)
#   mesi_max_workers 4foo;        # trailing garbage (atoi would silently accept 4)
#   mesi_max_workers 1000000000;  # above the 999999999 cap
#   mesi_max_workers "";          # empty
#   mesi_max_workers;             # missing argument
