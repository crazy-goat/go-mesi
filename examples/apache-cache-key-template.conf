# Apache Cache Key Template Example — MesiCacheKeyTemplate (#177)
#
# Lets <esi:include> cache keys vary by request headers/cookies via the
# shared mesi.BuildCacheKey helper. Without a template duplicate include
# URLs share one entry (URL-only DefaultCacheKey: "mesi:" + url). With
# a template the rendered value is namespaced by the SSRF-policy fingerprint
# (AllowedHosts + BlockPrivateIPs + client type), matching Caddy /
# RoadRunner / Traefik / php-ext semantics — unknown placeholders stay
# literal, empty/absent falls back to URL-only for backward compat.
#
# Placeholders:
#   ${url}              — verbatim include URL
#   ${header:Name}      — request header (case-insensitive)
#   ${cookie:Name}      — request cookie (case-insensitive)
#
# Only meaningful when a cache backend is configured; with MesiCacheBackend
# empty/unset the template has no effect (no cache to key into). Requires
# libgomesi.so with ParseWithConfigCtx (built from libgomesi/ at HEAD) —
# older builds ignore the template and log a warning.
#
# This example mirrors examples/php-ext-cache-key-template.php.

LoadModule mesi_module modules/mod_mesi.so

EnableMesi on

# Restrict ESI includes to trusted backends (optional SSRF guard).
MesiAllowedHosts backend raw.githubusercontent.com
MesiBlockPrivateIPs Off

# Cache backend: required for the template to have any effect.
MesiCacheBackend memory
MesiCacheSize 1000
MesiCacheTTL 60

# Template that varies cache entries by Accept-Language.
MesiCacheKeyTemplate "mesi:${url}:${header:Accept-Language}"

# With cookies instead: segment callers see distinct entries.
# MesiCacheKeyTemplate "mesi:${url}:${cookie:segment}"

# With both header and cookie: fully isolated keys.
# MesiCacheKeyTemplate "mesi:${url}:${header:Accept-Language}:${cookie:segment}"

# Unknown placeholders (e.g. ${unknown:foo}) stay literal.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/
</VirtualHost>
