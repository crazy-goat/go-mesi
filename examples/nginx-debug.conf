# Nginx mesi_debug Configuration Example (#223)
#
# Enables debug logging from the Go ESI parser
# (mesi.EsiParserConfig.Debug). Default off — omitting the directive
# keeps the request on the legacy positional path and the parser
# silent, byte-identical to previous behaviour. When on, the module
# routes the parse through libgomesi's ParseJson entry point with
# {"debug":true}; the core's default logger then writes DEBUG lines for
# every parse, include and fetch (URL, HTTP status, duration, failure
# reason) to stderr.
#
# Where the output goes: the Go logger writes to os.Stderr, i.e. the
# nginx worker's file descriptor 2 — it does NOT go through nginx's own
# error_log pipeline. Docker captures it in `docker compose logs
# nginx`; on a bare-metal host it lands wherever the process's stderr
# points (systemd journal, terminal, or a shell redirect such as
# `2>> /var/log/nginx/error.log`). nginx's `error_log stderr;` also
# targets fd 2, which is why the two streams usually appear together.
#
# Debug output is NOT sent to the client. It is high-volume (several
# lines per include) and contains every fetched include URL, which can
# leak internal hostnames or signed query strings when logs are shared.
# Use it only while troubleshooting a specific location — never
# globally and never as a long-term production setting.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore mesi_debug
#     with a logged per-request warning and keep the parser silent)
#
# Usage:
#   mesi_debug is location-scoped. Nested locations inherit the
#   enclosing location's value; an explicit off in a child overrides an
#   inherited on (the unset sentinel is -1, not 0).

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Troubleshooting location: turn on parser logging. Watch stderr:
    #   docker compose logs -f nginx | grep DEBUG
    # Expected lines include:
    #   DEBUG parse_start input_size=... token_count=...
    #   DEBUG include_start src=http://... fetch_mode= max_depth=5 timeout=...
    #   DEBUG fetch_start url=http://... timeout=...
    #   DEBUG fetch_done url=http://... duration=... status=200
    #   DEBUG include_failed src=http://... error=...   (for a failed include)
    location /troubleshoot/ {
        enable_mesi on;
        mesi_debug on;
        mesi_block_private_ips off;   # only for a trusted internal backend
        proxy_pass http://backend;
    }

    # Explicit silence, e.g. a child that must never log even when the
    # enclosing location opts in. This is a CONFIGURED off (not the
    # unset sentinel), so the parse goes through ParseJson with
    # {"debug":false}.
    location /troubleshoot/quiet/ {
        enable_mesi on;
        mesi_debug off;
        proxy_pass http://backend;
    }

    # Parent on, nested child inherits it; the grandchild can override.
    location /diagnostics/ {
        enable_mesi on;
        mesi_debug on;
        proxy_pass http://backend;

        location /diagnostics/child/ {
            # No mesi_debug here: inherits on from the parent.
            proxy_pass http://backend;
        }

        location /diagnostics/quiet/ {
            mesi_debug off;   # overrides the inherited on
            proxy_pass http://backend;
        }
    }

    # No mesi_debug at all: default off, legacy positional path
    # (byte-identical, parser silent).
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}

# The following are config-load ERRORS (`nginx -t` fails):
#   mesi_debug maybe;                        # not a flag value
#   mesi_debug;                              # missing argument
#   mesi_debug on; mesi_debug off;           # duplicate in one scope
