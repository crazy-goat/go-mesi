# Apache MesiDebug Configuration Example
#
# Enables debug logging from the Go ESI parser (mesi.EsiParserConfig.Debug).
# Default Off — the parser stays silent, byte-identical to previous
# behaviour. When On, the module routes the parse through libgomesi's
# ParseJson entry point with {"debug":true}; the core's logger emits DEBUG
# lines for every parse, include and fetch (URL, HTTP status, failure
# reason) to stderr, which Apache captures in its error log (ErrorLog).
#
# Debug output is NOT sent to the client. It contains fetch URLs (a
# potential information leak in shared logs) and is high-volume, so use it
# only while troubleshooting — never as a long-term production setting.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore MesiDebug with
#     a logged warning and keep the parser silent)
#
# Usage:
#   Directives are server-context (RSRC_CONF): set globally and/or per
#   <VirtualHost>. A vhost's value overrides the global one; vhosts
#   without the directive inherit the global value; an explicit Off
#   overrides an inherited On.

# Global default: keep the parser silent everywhere.
EnableMesi On
MesiDebug Off

<VirtualHost *:8080>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Troubleshooting vhost: turn on parser logging. Watch the error log:
    #   tail -f /var/log/apache2/error.log | grep DEBUG
    # Expected lines include:
    #   DEBUG parse_start input_size=... token_count=...
    #   DEBUG include_start src=http://... fetch_mode= max_depth=5 timeout=...
    #   DEBUG fetch_start url=http://... timeout=...
    #   DEBUG include_failed src=http://... error=...   (for a failed include)
    # fetch_mode is logged verbatim from the <esi:include> tag, so it is empty
    # when the tag has no fetch-mode attribute (fetch-mode="fallback" would
    # print fetch_mode=fallback).
    MesiDebug On
</VirtualHost>

<VirtualHost *:8081>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Explicit silence even if the global default changes to On.
    MesiDebug Off
</VirtualHost>

<VirtualHost *:8082>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # No MesiDebug here: inherits the global Off (or the Off default when
    # the global directive is also absent).
</VirtualHost>
