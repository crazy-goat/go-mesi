# Nginx AllowedHosts Configuration Example
#
# This example shows how to restrict ESI includes to a whitelist of
# approved origin hosts with mesi_allowed_hosts. The directive takes a
# space-separated host list (mirroring Apache's MesiAllowedHosts format).
#
# Matching semantics (enforced by libgomesi, do not reimplement):
#   - exact or subdomain suffix match: example.com matches example.com
#     and sub.example.com
#   - the "." boundary prevents suffix injection: attacker-example.com
#     and notexample.com do NOT match example.com
#   - ports are ignored: http://backend:8000/ matches entry "backend"
#
# Two-phase SSRF check:
#   1. AllowedHosts is checked by hostname before any connection attempt.
#   2. BlockPrivateIPs (mesi_block_private_ips) runs at dial time on the
#      resolved IP address.
# Both directives are independent and complementary — keep the dial-time
# block on unless you intentionally include from private backends.
#
# Pre-reqs:
#   - libgomesi.so built with ParseWithConfig (libgomesi.go)
#   - The ngx_http_mesi_module.so loaded via load_module
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.

location / {
    enable_mesi on;

    # Whitelist of approved include origins: one quoted argument,
    # hostnames separated by spaces (mirrors Apache's MesiAllowedHosts
    # content format; quoting is the nginx way to pass a list).
    mesi_allowed_hosts "backend.internal cdn.example.com api.trusted.org";

    # Keep dial-time SSRF blocking on unless the backends above
    # intentionally resolve to private IPs.
    mesi_block_private_ips on;

    proxy_pass http://backend;
}

# Backward-compatible operation: unset = no hostname restriction
# (subject to mesi_block_private_ips).
location /legacy/ {
    enable_mesi on;
    mesi_block_private_ips off;
    proxy_pass http://legacy-backend;
}
