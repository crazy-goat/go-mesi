# Nginx mesi_parse_on_header Configuration Example (#188)
#
# With mesi_parse_on_header on, a text/html response is buffered and
# parsed only when it carries the upstream header:
#
#     Edge-control: dca=esi
#
# The value is a case-insensitive, comma-separated list, so
# `Edge-control: no-cache, dca=esi` also matches while
# `Edge-control: max-age=60` does not (same contract as
# mesi.IsEsiResponse, Caddy's parse_on_header and Apache's
# MesiParseOnHeader).
#
# Every other HTML response is passed through byte for byte with its
# upstream headers: the check runs in the head filter before body
# accumulation, so the page is not buffered, is not limited by
# mesi_max_body_size, and the module does not add its
# Surrogate-Capability: ESI/1.0 header. Non-HTML responses are
# unaffected. Without the directive (the default off) every text/html
# response is parsed, which is the backward-compatible behaviour.
#
# The flag is also sent to libgomesi through ParseJson as
# {"parseOnHeader":true}, so a fetched HTML fragment is parsed only when
# its own response signals ESI. That nested-fragment half needs a
# libgomesi.so exporting ParseJson; older builds log a warning and keep
# the top-level head filter working.
#
# Note: do not combine mesi_parse_on_header with mesi_cache_backend. A
# cache hit does not carry the ESI signal, so a signalling fragment is
# parsed on the first request but its nested <esi:include> tags stay raw
# on later cached requests.
#
# Usage:
#   mesi_parse_on_header is location-scoped. Nested locations inherit the
#   enclosing location's value; an explicit off in a child overrides an
#   inherited on (the unset sentinel is -1, not 0).

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Per-response opt-in: only backends that send
    # `Edge-control: dca=esi` have their HTML parsed.
    location /esi/ {
        enable_mesi on;
        mesi_parse_on_header on;
        proxy_pass http://backend;
    }

    # Always parse, even when the backend sends no signal (the
    # backward-compatible default). Explicit off overrides an inherited
    # on from an enclosing location.
    location /always/ {
        enable_mesi on;
        mesi_parse_on_header off;
        proxy_pass http://backend;
    }

    # Unset → off: every text/html response is parsed (legacy path,
    # byte-identical to previous releases).
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }

    # Parent on, nested child inherits it; the grandchild can opt out.
    location /mixed/ {
        enable_mesi on;
        mesi_parse_on_header on;
        proxy_pass http://backend;

        location /mixed/child/ {
            # No mesi_parse_on_header here: inherits on from the parent.
            proxy_pass http://backend;
        }
    }
}
