# Nginx mesi_max_depth Configuration Example
#
# Limits how many levels of <esi:include> are recursively processed.
# Unset → 5 (the historical hardcoded default, backward compatible).
# Explicit 0 is valid passthrough: no <esi:include> is fetched; the
# tags are stripped through the include-error path (empty default
# marker), never left raw in the response. Range [0, 10000] matches
# mesi.MaxMaxDepth / Apache MesiMaxDepth / Caddy max_depth. Invalid
# values (negative, sign, decimal, non-integer, empty, above the cap)
# fail `nginx -t` at config load — never silently coerced.
#
# Pre-reqs:
#   - libgomesi.so
#   - ngx_http_mesi_module.so loaded via load_module
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.
#   mesi_max_depth is location-scoped; nested locations inherit the
#   enclosing location's value unless they set their own.

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Process one include level: the outer include is fetched, then the
    # fragment is re-parsed with MaxDepth=0 (ParseOnly). Inner
    # <esi:include> tags are replaced with the empty IncludeErrorMarker
    # (not left in the HTML, not fetched).
    location /shallow/ {
        enable_mesi on;
        mesi_max_depth 1;
        proxy_pass http://backend;

        # Nested locations inherit the enclosing location's value
        # (ngx_conf_merge_value): this child is also limited to depth 1.
        location /shallow/fragments/ {
            proxy_pass http://backend;
        }
    }

    # Passthrough: no <esi:include> is fetched; the tags are stripped
    # through the include-error path (empty default marker), never left
    # raw in the response (cross-platform depth-0 contract).
    location /no-esi/ {
        enable_mesi on;
        mesi_max_depth 0;
        proxy_pass http://backend;
    }

    # A nested location can also override its parent's value.
    location /deep/ {
        enable_mesi on;
        mesi_max_depth 0;
        proxy_pass http://backend;

        location /deep/fragments/ {
            mesi_max_depth 100;   # overrides the parent's 0
            proxy_pass http://backend;
        }
    }

    # Omit mesi_max_depth entirely to keep the default of 5.
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}
