# Apache MesiParseOnHeader Configuration Example
#
# With MesiParseOnHeader On, an HTML response is buffered and parsed only
# when it carries the upstream header:
#
#     Edge-control: dca=esi
#
# The value is a case-insensitive, comma-separated list, so
# `Edge-control: no-cache, dca=esi` also matches while
# `Edge-control: max-age=60` does not (same contract as
# mesi.IsEsiResponse and Caddy's parse_on_header).
#
# Every other HTML response is passed through byte for byte with its
# upstream headers: the check runs before body accumulation, so the page
# is not buffered, is not limited by MesiMaxBodySize, and the module does
# not add its Surrogate-Capability: ESI/1.0 header. Non-HTML responses are
# unaffected. Without the directive (the default Off) every text/html
# response is parsed, which is the backward-compatible behaviour.
#
# The flag is also sent to libgomesi through ParseJson as
# {"parseOnHeader":true}, so a fetched HTML fragment is parsed only when
# its own response signals ESI. That nested-fragment half needs a
# libgomesi.so exporting ParseJson; older builds log a warning and keep
# the top-level filter working.
#
# Note: do not combine MesiParseOnHeader with MesiCacheBackend. A cache
# hit does not carry the ESI signal, so a signalling fragment is parsed on
# the first request but its nested <esi:include> tags stay raw on later
# cached requests.
#
# Usage:
#   Directives are server-context (RSRC_CONF): set globally and/or per
#   <VirtualHost>. A vhost's value overrides the global one; vhosts
#   without the directive inherit the global value; an explicit Off
#   overrides an inherited On.

EnableMesi On

# Global default: keep the always-parse behaviour for every vhost.
MesiParseOnHeader Off

<VirtualHost *:8080>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Per-response opt-in: only backends that send
    # `Edge-control: dca=esi` have their HTML parsed.
    MesiParseOnHeader On
</VirtualHost>

<VirtualHost *:8081>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Explicit Off even if the global default changes to On.
    MesiParseOnHeader Off
</VirtualHost>

<VirtualHost *:8082>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # No MesiParseOnHeader here: inherits the global Off (or the Off
    # default when the global directive is also absent).
</VirtualHost>
