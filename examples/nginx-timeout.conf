# Nginx mesi_timeout Configuration Example
#
# Bounds every <esi:include> fetch of a single ESI parse to N seconds.
# Unset → 30 (the historical hardcoded libgomesi default — omitting the
# directive keeps the byte-identical legacy path). Range [1, 86400]
# (24h), matching libgomesi's config.MaxTimeoutSeconds / ValidateTimeout
# / Apache MesiTimeout / PHP extension timeout. 0 is REJECTED at config
# load — it does not mean "no timeout": the core fails every include
# immediately when Timeout <= 0 (mesi/fetch.go → ErrTimeBudgetExceeded),
# and Caddy rejects a non-positive `timeout` for the same reason; an
# unlimited budget would also pin a goroutine per queued include while a
# backend hangs. Invalid values (0, negative, sign, decimal,
# non-integer, empty, above the cap) fail `nginx -t` at load — parsed
# by a custom setter (mirroring mesi_max_depth), never a silent
# coercion. The budget covers one include fetch end-to-end (redirect
# chain + body read), NOT the overall response — nginx's own
# proxy_read_timeout etc. still govern the client-facing request.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore mesi_timeout
#     with a logged warning and keep the 30s default)
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.
#   mesi_timeout is location-scoped; nested locations inherit the
#   enclosing location's value unless they set their own.

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Tight SLA: every include fetch is aborted at 2s — a slow fragment
    # renders as the empty IncludeErrorMarker (or the tag's fallback
    # body / onerror="continue" behaviour) instead of holding the whole
    # request hostage. Worst-case ESI latency ≈ mesi_timeout + render.
    location /tight-sla/ {
        enable_mesi on;
        mesi_timeout 2;
        proxy_pass http://backend;

        # Nested locations inherit the enclosing location's value
        # (ngx_conf_merge_value): this child is also limited to 2s.
        location /tight-sla/fragments/ {
            proxy_pass http://backend;
        }
    }

    # Generous budget for legitimately slow backends (>30s responses).
    location /slow-backend/ {
        enable_mesi on;
        mesi_timeout 120;
        proxy_pass http://backend;
    }

    # A nested location can also override its parent's budget.
    location /mixed/ {
        enable_mesi on;
        mesi_timeout 2;
        proxy_pass http://backend;

        location /mixed/fragments/ {
            mesi_timeout 60;   # overrides the parent's 2
            proxy_pass http://backend;
        }
    }

    # Omit mesi_timeout entirely to keep the default of 30s.
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}

# The following are config-load ERRORS (`nginx -t` fails):
#   mesi_timeout 0;      # not "unlimited" — rejected (see header)
#   mesi_timeout -1;     # negative
#   mesi_timeout 2.5;    # decimal
#   mesi_timeout abc;    # non-integer
#   mesi_timeout 86401;  # above the 86400 cap
