# Apache MesiMaxWorkers Configuration Example (#171)
#
# Caps the size of the include worker pool that drains <esi:include>
# ESI jobs within one page render. Scope: one MESIParse call — one
# nesting level in one Apache worker thread/process, NOT process-wide
# or vhost-wide: each nested parse spawns its own pool and inherits
# the cap, multiple concurrent page requests each get their own pool,
# and under MPM worker/event each thread applies the limit
# independently. The core spawns min(MaxWorkers, job count) goroutines
# (mesi/parser.go) and each processes one include at a time.
#
# Distinction from MesiMaxConcurrentRequests (#170): that directive
# bounds concurrent <esi:include> HTTP fetches (an admission semaphore
# — connection fan-out against the backend); MesiMaxWorkers bounds the
# CPU-side goroutine pool that processes tokens/includes — on a flat
# page the pool also caps fetch concurrency at that level, but it
# additionally bounds token-processing work (CPU-intensive
# include-tree traversal on deeply nested pages; MesiMaxWorkers 1
# serializes token processing — useful for debugging).
#
# Unset → library default runtime.NumCPU()*4: libgomesi leaves
# EsiParserConfig.MaxWorkers at 0, which the core replaces with
# NumCPU*4 for any value <= 0 (mesi/parser.go), so omitting the
# directive is byte-identical to pre-#171 behaviour (same contract as
# the core's "Zero means runtime.NumCPU()*4" and Caddy's unset
# max_workers). Explicit 0 = the same "library default" (a
# legitimate configured value that overrides an inherited cap). Range
# [0, 999999999]: neither core nor Caddy caps the value (Caddy's bare
# strconv.Atoi accepts negatives and unbounded values — not inherited
# here) — the bound is the portable transport range (C `int` +
# parse_nonneg_int's 9-digit guard), kept in sync with libgomesi's
# config.MaxMaxWorkers — see docs/features.md. Invalid values
# (negative, sign, decimal, non-integer, empty, above the cap) fail
# `apachectl configtest` at load — parsed by the strict parse_nonneg_int
# helper, never a silent atoi coercion (the issue's atoi sketch is
# superseded: it would turn "abc"/"" into 0 = library default and
# accept trailing garbage like "4foo"). A negative must never reach the
# core, which substitutes the default for any <= 0 silently, with no
# warning at all (no #329-style diagnostic exists for MaxWorkers).
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore
#     MesiMaxWorkers with a logged warning and keep the library
#     default NumCPU*4 pool)
#
# Usage:
#   Directives are server-context (RSRC_CONF): set globally and/or per
#   <VirtualHost>. A vhost's value overrides the global one; vhosts
#   without the directive inherit the global value (unset + unset →
#   library default).

# Global default for every vhost that does not set its own value.
EnableMesi On
MesiMaxWorkers 8

<VirtualHost *:8080>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Worker-pool cap: this vhost OVERRIDES the global 8. Every parse
    # level of a page rendered here drains its includes through at most
    # 2 goroutines — bounds CPU-side token processing on deeply nested
    # pages. Includes beyond the pool are queued in the jobs channel,
    # never dropped.
    MesiMaxWorkers 2
</VirtualHost>

<VirtualHost *:8081>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Explicit "library default" (NumCPU*4): OVERRIDES the global 8
    # cap above (the -1 unset sentinel makes a stored 0 distinguishable
    # from "inherit").
    MesiMaxWorkers 0
</VirtualHost>

# The following are config-load ERRORS (apachectl configtest fails):
#   MesiMaxWorkers -1        # negative (core would silently use the library default)
#   MesiMaxWorkers +4        # non-canonical sign
#   MesiMaxWorkers 2.5       # decimal
#   MesiMaxWorkers abc       # non-integer (atoi would silently mean library default)
#   MesiMaxWorkers 4foo      # trailing garbage (atoi would silently accept 4)
#   MesiMaxWorkers 1000000000  # above the 999999999 cap
