# Apache MesiTimeout Configuration Example
#
# Bounds every <esi:include> fetch of a single ESI parse to N seconds.
# Unset → 30 (the historical hardcoded libgomesi default — omitting the
# directive is byte-identical to previous behaviour). Range [1, 86400]
# (24h), matching libgomesi's config.MaxTimeoutSeconds / ValidateTimeout.
# 0 is REJECTED at config load — it does not mean "no timeout": the core
# fails every include immediately when Timeout <= 0 (mesi/fetch.go →
# ErrTimeBudgetExceeded), and Caddy rejects a non-positive `timeout` for
# the same reason; an unlimited budget would also pin a goroutine per
# queued include while a backend hangs. Invalid values (0, negative,
# sign, decimal, non-integer, empty, above the cap) fail
# `apachectl configtest` at load — parsed by parse_nonneg_int, never a
# silent atoi coercion (the issue's atoi sketch is superseded).
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore MesiTimeout
#     with a logged warning and keep the 30s default)
#
# Usage:
#   Directives are server-context (RSRC_CONF): set globally and/or per
#   <VirtualHost>. A vhost's value overrides the global one; vhosts
#   without the directive inherit the global value (unset + unset → 30s).

# Global default for every vhost that does not set its own value.
EnableMesi On
MesiTimeout 30

<VirtualHost *:8080>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Tight SLA: this vhost OVERRIDES the global 30s. Every include
    # fetch is aborted at 2s — a slow fragment renders as the empty
    # IncludeErrorMarker (or the tag's fallback body / onerror="continue"
    # behaviour) instead of holding the whole request hostage. Worst-case
    # ESI latency ≈ MesiTimeout + render.
    MesiTimeout 2
</VirtualHost>

<VirtualHost *:8081>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Generous budget for legitimately slow backends (>30s responses).
    MesiTimeout 120
</VirtualHost>

<VirtualHost *:8082>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # No MesiTimeout here: inherits the global 30s (or the 30s default
    # when the global directive is also absent).
</VirtualHost>

# The following are config-load ERRORS (apachectl configtest fails):
#   MesiTimeout 0      # not "unlimited" — rejected (see header)
#   MesiTimeout -1     # negative
#   MesiTimeout 2.5    # decimal
#   MesiTimeout abc    # non-integer
#   MesiTimeout 86401  # above the 86400 cap
