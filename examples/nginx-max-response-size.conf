# Nginx mesi_max_response_size Configuration Example (#208)
#
# Caps the HTTP response body size, in bytes, of a single
# <esi:include> fetch. An over-limit include fails its fetch and
# renders the empty IncludeErrorMarker (or the tag's fallback body /
# onerror="continue" behaviour) — the limit is per SINGLE include, not
# per page, and the core fails CLOSED (never a truncated body, never a
# crashed worker).
#
# Unset → unlimited: the request stays on the legacy positional path,
# where libgomesi leaves EsiParserConfig.MaxResponseSize at 0, which
# the core treats as "no limit" (mesi/fetch.go only limits when
# MaxResponseSize > 0), so omitting the directive is byte-identical to
# pre-#208 behaviour. NOTE: the 10 MB of mesi.CreateDefaultConfig()
# does NOT apply here — that default only reaches Go callers using the
# constructor. Explicit 0 = unlimited as well (a legitimate configured
# value that overrides an inherited limit). Range
# [0, 9223372036854775806] (math.MaxInt64 - 1, derived from the core's
# `MaxResponseSize + 1` LimitReader bound — see docs/features.md).
# Plain integer BYTES only: k/m/g suffixes are rejected at config load
# (cross-platform grammar — Apache MesiMaxResponseSize, PHP extension
# max_response_size and CLI -max-response-size are all plain-int
# bytes). Invalid values (negative, sign, decimal, non-integer,
# trailing garbage, suffix, empty, above the cap) fail `nginx -t` at
# load — parsed by a custom setter (mirroring mesi_max_depth /
# mesi_timeout), never a silent coercion.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore
#     mesi_max_response_size with a logged warning and keep unlimited)
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.
#   mesi_max_response_size is location-scoped; nested locations
#   inherit the enclosing location's value unless they set their own
#   (an explicit 0 in a child overrides an inherited limit — the
#   unset sentinel is -1, not 0).

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Small fragments only: includes over 1 MB fail their fetch and
    # render as the empty IncludeErrorMarker — protects the worker
    # from a compromised backend streaming huge bodies into memory.
    location /small-fragments/ {
        enable_mesi on;
        mesi_max_response_size 1048576;
        proxy_pass http://backend;

        # Nested locations inherit the enclosing location's value
        # (ngx_conf_merge_off_value): this child is also capped at 1 MB.
        location /small-fragments/fragments/ {
            proxy_pass http://backend;
        }
    }

    # Tight cap for tiny fragments (e.g. 100 bytes): anything larger
    # is rejected at fetch time.
    location /tiny-fragments/ {
        enable_mesi on;
        mesi_max_response_size 100;
        proxy_pass http://backend;
    }

    # A nested location can override an inherited limit — explicit 0
    # is the documented "unlimited" value and OVERRIDES the parent's
    # 100 (the sentinel being -1 is what keeps "0 configured"
    # distinguishable from "unset").
    location /mixed/ {
        enable_mesi on;
        mesi_max_response_size 100;
        proxy_pass http://backend;

        location /mixed/unlimited/ {
            mesi_max_response_size 0;   # overrides the parent's 100
            proxy_pass http://backend;
        }
    }

    # Omit mesi_max_response_size entirely to keep unlimited (the
    # byte-identical legacy path).
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}

# The following are config-load ERRORS (`nginx -t` fails):
#   mesi_max_response_size -1;                    # negative (would silently mean "unlimited")
#   mesi_max_response_size +100;                  # non-canonical sign
#   mesi_max_response_size 1048576.5;             # decimal
#   mesi_max_response_size abc;                   # non-integer
#   mesi_max_response_size 100abc;                # trailing garbage
#   mesi_max_response_size 10m;                   # suffix not in the cross-platform grammar
#   mesi_max_response_size "";                    # empty
#   mesi_max_response_size;                       # missing argument
#   mesi_max_response_size 9223372036854775807;   # above the MaxInt64-1 cap
