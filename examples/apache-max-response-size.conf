# Apache MesiMaxResponseSize Configuration Example (#169)
#
# Caps the HTTP response body size, in bytes, of a single
# <esi:include> fetch. An over-limit include fails its fetch and
# renders the empty IncludeErrorMarker (or the tag's fallback body /
# onerror="continue" behaviour) — the limit is per SINGLE include, not
# per page.
#
# Unset → unlimited: libgomesi leaves EsiParserConfig.MaxResponseSize
# at 0, which the core treats as "no limit" (mesi/fetch.go only limits
# when MaxResponseSize > 0), so omitting the directive is
# byte-identical to pre-#169 behaviour. NOTE: the 10 MB of
# mesi.CreateDefaultConfig() does NOT apply here — that default only
# reaches Go callers using the constructor. Explicit 0 = unlimited as
# well (a legitimate configured value that overrides an inherited
# limit). Range [0, 9223372036854775806] (math.MaxInt64 - 1, derived
# from the core's `MaxResponseSize + 1` LimitReader bound — see
# docs/features.md). Invalid values (negative, sign, decimal,
# non-integer, empty, above the cap) fail `apachectl configtest` at
# load — parsed by the strict parse_nonneg_off helper, never a silent
# atoi/apr_strtoff coercion (the issue's apr_strtoff sketch is
# superseded: with end=NULL it would silently accept "100abc").
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore
#     MesiMaxResponseSize with a logged warning and keep unlimited)
#
# Usage:
#   Directives are server-context (RSRC_CONF): set globally and/or per
#   <VirtualHost>. A vhost's value overrides the global one; vhosts
#   without the directive inherit the global value (unset + unset →
#   unlimited).

# Global default for every vhost that does not set its own value.
EnableMesi On
MesiMaxResponseSize 10485760

<VirtualHost *:8080>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Small includes only: fragments over 1 MB fail their fetch and
    # render as the empty IncludeErrorMarker — protects the worker
    # from a compromised backend streaming huge bodies into memory.
    MesiMaxResponseSize 1048576
</VirtualHost>

<VirtualHost *:8081>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Tight cap for tiny fragments (e.g. 100 bytes): anything larger
    # is rejected at fetch time.
    MesiMaxResponseSize 100
</VirtualHost>

<VirtualHost *:8082>
    ServerName localhost
    ProxyPreserveHost On
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Explicit "unlimited": OVERRIDES the global 10 MB cap above
    # (the -1 unset sentinel makes a stored 0 distinguishable from
    # "inherit"). Only do this if the backend is trusted — an
    # unbounded include can exhaust worker memory.
    MesiMaxResponseSize 0
</VirtualHost>

# The following are config-load ERRORS (apachectl configtest fails):
#   MesiMaxResponseSize -1                    # negative
#   MesiMaxResponseSize +100                  # non-canonical sign
#   MesiMaxResponseSize 2.5                   # decimal
#   MesiMaxResponseSize abc                   # non-integer
#   MesiMaxResponseSize 100abc                # trailing garbage
#   MesiMaxResponseSize 9223372036854775807   # above the MaxInt64-1 cap
