# Nginx Cache Key Template Configuration Example
#
# This example shows how to compose ESI cache keys from the incoming
# request's context with mesi_cache_key_template, so fragments that vary
# by request header or cookie (e.g. localised includes selected by
# Accept-Language, A/B-test segments) get one cache entry per variant
# instead of the URL-only DefaultCacheKey ("mesi:" + url) that pins the
# first-rendered variant for everyone.
#
# Template placeholders (evaluated by the shared mesi.BuildCacheKey
# helper in libgomesi — identical semantics on Caddy / RoadRunner /
# Traefik / Apache / PHP extension):
#   ${url}           the include URL (verbatim)
#   ${header:Name}   request header value (case-insensitive lookup)
#   ${cookie:Name}   cookie value (case-insensitive lookup)
# Unknown placeholders stay literal. nginx takes the template VERBATIM —
# no Apache-style "$$" escaping is needed (nginx does not interpolate
# ${VAR} in directive arguments). Validation: <= 4096 bytes, control
# chars/DEL rejected at config load (nginx -t fails).
#
# Requires libgomesi.so with ParseWithConfigCtx; older builds ignore the
# template with a logged warning and fall back to URL-only keys.
#
# Pre-reqs:
#   - a cache backend is enabled (mesi_cache_backend memory|redis|memcached)
#     — a template without a cache backend has no effect
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.

location /localized/ {
    enable_mesi on;

    mesi_cache_backend memory;
    mesi_cache_size 5000;
    mesi_cache_ttl 60;

    # One cache entry per language variant of the same include URL.
    mesi_cache_key_template "mesi:${url}:${header:Accept-Language}";

    proxy_pass http://backend;
}

# Header + cookie composition: A/B-test segment from a cookie and the
# language from a header, both in the same key.
location /personalized/ {
    enable_mesi on;

    mesi_cache_backend memcached;
    mesi_cache_ttl 120;
    mesi_cache_memcached_servers "10.0.0.1:11211 10.0.0.2:11211";

    mesi_cache_key_template "mesi:${url}:${header:Accept-Language}:${cookie:segment}";

    proxy_pass http://backend;
}

# Backward-compatible operation: unset (or empty) = URL-only
# DefaultCacheKey ("mesi:" + url) — identical to the pre-template
# behaviour, header/cookie agnostic.
location /legacy/ {
    enable_mesi on;
    mesi_cache_backend memory;
    mesi_cache_ttl 30;
    proxy_pass http://backend;
}
