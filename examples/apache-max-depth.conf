# Apache MesiMaxDepth Configuration Example
#
# Limits how many levels of <esi:include> are recursively processed.
# Unset → 5 (the historical hardcoded default). Explicit 0 is valid
# passthrough (no ESI fetch). Range [0, 10000] matches mesi.MaxMaxDepth
# / Caddy. Invalid values are rejected at config load — never silently
# coerced via atoi.
#
# Pre-reqs:
#   - libgomesi.so
#   - mod_mesi.so loaded via LoadModule
#
# Usage:
#   Drop these directives into httpd.conf / a VirtualHost and reload
#   Apache. MesiMaxDepth is RSRC_CONF (server / VirtualHost scope).

LoadModule mesi_module modules/mod_mesi.so

EnableMesi on

# Restrict ESI includes to trusted backends (optional SSRF guard).
MesiAllowedHosts backend raw.githubusercontent.com
MesiBlockPrivateIPs Off

# Process one include level: the fetched fragment's inner <esi:include>
# tags are left unprocessed. Use 5 (or omit the directive) for the
# historical default; use 0 to disable ESI fetching entirely.
MesiMaxDepth 1

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/
</VirtualHost>
