# Nginx AllowPrivateIPsForAllowedHosts Configuration Example
#
# This example shows how to let trusted hosts in mesi_allowed_hosts
# resolve to private/reserved IPs while keeping the dial-time
# mesi_block_private_ips block ON for everything else. Use this in
# service meshes / internal networks where ESI includes legitimately
# target internal backends on private IPs.
#
# SECURITY WARNING: this trusts DNS for the hosts in mesi_allowed_hosts.
# If an attacker can control DNS for a listed host, they can resolve it
# to a private IP (e.g. 169.254.169.254) and bypass SSRF protection.
# Only use with internal DNS you control (Consul, Kubernetes DNS,
# /etc/hosts).
#
# The bypass is ONLY effective when BOTH mesi_block_private_ips on AND
# a non-empty mesi_allowed_hosts are set; otherwise it is a no-op.
# Hosts NOT in mesi_allowed_hosts are always subject to the dial-time
# block, regardless of this directive.
#
# Pre-reqs:
#   - libgomesi.so built with ParseWithConfigEx (libgomesi.go, since #168)
#     — older builds log a warning that the bypass is disabled and fall
#     back to ParseWithConfig
#   - The ngx_http_mesi_module.so loaded via load_module
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.

location / {
    enable_mesi on;

    # Trusted internal backend (resolves to a private IP inside the mesh).
    mesi_allowed_hosts "backend.internal";

    # Secure default stays ON — only allowlisted hosts may reach private
    # IPs (and only because of the directive below).
    mesi_block_private_ips on;

    # Allow backend.internal (and only it) to resolve to a private IP.
    mesi_allow_private_ips_for_allowed on;

    proxy_pass http://backend;
}
