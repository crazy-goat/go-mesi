# Nginx mesi_max_concurrent_requests Configuration Example (#214)
#
# Caps the number of concurrent <esi:include> HTTP fetches within one
# page render. Scope: one MESIParse call — a single page render in one
# nginx worker, NOT worker-global or vhost-wide: each concurrent
# request's own parse builds its own admission semaphore (4 workers x
# cap 5 -> up to 20 outbound connections). Includes queued beyond the
# cap wait for a free slot (bounded by the fetch budget — the
# mesi_timeout deadline covers the admission wait); they are never
# dropped.
#
# Unset -> unlimited: the request stays on the legacy positional path,
# where libgomesi leaves EsiParserConfig.MaxConcurrentRequests at 0,
# which the core treats as "no limit" (mesi/parser.go only installs
# the semaphore when > 0), so omitting the directive is byte-identical
# to pre-#214 behaviour (same contract as the core's "0 = unlimited"
# and Caddy's unset max_concurrent_requests). Explicit 0 = unlimited
# as well (a legitimate configured value that overrides an inherited
# cap). Range [0, 999999999]: neither core nor Caddy caps the value —
# the bound is the portable transport range (C `int` + the shared
# 9-digit strict parsers), kept in sync with libgomesi's
# config.MaxMaxConcurrentRequests / Apache MESI_MAX_MAX_CONCURRENT_
# REQUESTS — see docs/features.md. Invalid values (negative, sign,
# decimal, non-integer, empty, above the cap) fail `nginx -t` at load
# — parsed by a custom setter (mirroring mesi_max_depth /
# mesi_timeout / mesi_max_response_size), never a silent coercion (the
# issue's ngx_conf_set_num_slot sketch is superseded: ngx_atoi has no
# upper bound). A negative must never reach the core, which (since
# #329) only warns and normalizes it to 0 = unlimited.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore
#     mesi_max_concurrent_requests with a logged warning and keep
#     unlimited)
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.
#   mesi_max_concurrent_requests is location-scoped; nested locations
#   inherit the enclosing location's value unless they set their own
#   (an explicit 0 in a child overrides an inherited cap — the unset
#   sentinel is -1, not 0).

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Backpressure: this page's include fan-out never opens more than
    # 3 concurrent backend connections — protects file descriptors and
    # the upstream from an ESI-heavy page stampeding it (a page with
    # 20 includes fetches through 3 slots; the rest queue).
    location /fanout-cap/ {
        enable_mesi on;
        mesi_max_concurrent_requests 3;
        proxy_pass http://backend;

        # Nested locations inherit the enclosing location's value
        # (ngx_conf_merge_value): this child is also capped at 3.
        location /fanout-cap/fragments/ {
            proxy_pass http://backend;
        }
    }

    # Generous cap for legitimately fan-out-heavy pages.
    location /dashboards/ {
        enable_mesi on;
        mesi_max_concurrent_requests 20;
        proxy_pass http://backend;
    }

    # A nested location can also override an inherited cap — explicit 0
    # is the documented "unlimited" value and OVERRIDES the parent's
    # 3 (the sentinel being -1 is what keeps "0 configured"
    # distinguishable from "unset").
    location /mixed/ {
        enable_mesi on;
        mesi_max_concurrent_requests 3;
        proxy_pass http://backend;

        location /mixed/unlimited/ {
            mesi_max_concurrent_requests 0;   # overrides the parent's 3
            proxy_pass http://backend;
        }
    }

    # Omit mesi_max_concurrent_requests entirely to keep unlimited (the
    # byte-identical legacy path).
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}

# The following are config-load ERRORS (`nginx -t` fails):
#   mesi_max_concurrent_requests -1;          # negative (core would warn+normalize to unlimited)
#   mesi_max_concurrent_requests +3;          # non-canonical sign
#   mesi_max_concurrent_requests 2.5;         # decimal
#   mesi_max_concurrent_requests abc;         # non-integer (atoi would silently mean unlimited)
#   mesi_max_concurrent_requests 3foo;        # trailing garbage (atoi would silently accept 3)
#   mesi_max_concurrent_requests 1000000000;  # above the 999999999 cap
#   mesi_max_concurrent_requests "";          # empty
#   mesi_max_concurrent_requests;             # missing argument
