# Apache MesiIncludeErrorMarker Configuration Example (#165)
#
# Renders raw HTML in place of a failed <esi:include> when the tag has
# neither onerror="continue" nor a fallback body. This makes broken
# includes visible instead of silently removing content.
#
# Unset and explicit "" both mean silent (the historical behaviour).
# onerror="continue" and fallback tag bodies always take priority, so
# the marker never overrides them.
#
# SECURITY WARNING: the marker is inserted into the rendered page
# verbatim and is public output in production. Never put internal error
# details, upstream URLs, host names or IP addresses in it — use a
# fixed, static string.
#
# Scope: RSRC_CONF (server / VirtualHost). A vhost's value overrides
# the global one; unset vhosts inherit it, and an explicit empty value
# in a vhost clears an inherited marker.
#
# Syntax: the directive takes exactly one Apache config token, so a
# marker containing spaces must be quoted (as in the examples below).
# `MesiIncludeErrorMarker ""` is an explicit empty value that clears an
# inherited marker, not a missing argument. A bare directive, a
# whitespace-only value or trailing extra tokens fail config load.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson (older builds ignore the
#     directive with a logged warning and keep failed includes silent)
#   - mod_mesi.so loaded via LoadModule
#
# Usage:
#   Drop these directives into httpd.conf / a VirtualHost and reload
#   Apache.

LoadModule mesi_module modules/mod_mesi.so

EnableMesi On

# Restrict ESI includes to trusted backends (optional SSRF guard).
MesiAllowedHosts backend raw.githubusercontent.com
MesiBlockPrivateIPs Off

# Global marker for every vhost that does not set its own value.
MesiIncludeErrorMarker "<!-- ESI include failed -->"

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass /backend/ http://backend:8000/
    ProxyPassReverse /backend/ http://backend:8000/

    # This vhost inherits the global marker above. A failed include
    # (timeout, connection refused, SSRF block, non-2xx upstream)
    # renders "<!-- ESI include failed -->" in the page.
</VirtualHost>

<VirtualHost *:8080>
    ServerName staging.localhost
    DocumentRoot /var/www/html

    # A staging-only, more specific marker (still static — no URLs,
    # IPs or error text from the failed request).
    MesiIncludeErrorMarker "<!-- [staging] ESI include failed -->"
</VirtualHost>

<VirtualHost *:8081>
    ServerName quiet.localhost
    DocumentRoot /var/www/html

    # Explicit empty clears the inherited global marker: failed
    # includes disappear silently on this vhost.
    MesiIncludeErrorMarker ""
</VirtualHost>

# Config-load errors:
#   MesiIncludeErrorMarker
#       # missing argument (or whitespace-only) — use "" for explicit
#       # silent.
#   MesiIncludeErrorMarker <!-- x --> extra
#       # trailing token — quote the whole marker if it contains spaces.
#   MesiIncludeErrorMarker <!-- ESI include failed -->
#       # unquoted marker with spaces contains trailing tokens — write
#       # MesiIncludeErrorMarker "<!-- ESI include failed -->".
