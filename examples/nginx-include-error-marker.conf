# Nginx mesi_include_error_marker Configuration Example (#228)
#
# Renders a static HTML marker in place of a failed <esi:include> that
# has neither onerror="continue" nor a fallback tag body. Before #228
# such an include silently disappeared from the page.
#
# SECURITY: the marker is inserted into the public response verbatim as
# raw HTML. It must be a static, operator-controlled string and must
# NEVER contain internal error details, upstream URLs, host names, IP
# addresses or stack traces. The module only JSON-escapes the value on
# its way to libgomesi; it does not sanitise the HTML that reaches the
# client.
#
# Semantics:
#   - Unset            -> silent (legacy positional path, pre-#228)
#   - Non-empty marker -> rendered verbatim on the include-error path
#   - Explicit ""      -> configured but silent; clears an inherited
#                         marker in a nested location
#   - onerror="continue" and fallback tag bodies always take priority
#
# The value travels through libgomesi's ParseJson entry point as
# {"includeErrorMarker":"…"}. A marker containing spaces must be
# quoted; an unquoted single token is accepted. Missing arguments,
# unquoted multi-word values and trailing tokens fail `nginx -t`.
# Older libgomesi builds without ParseJson log a per-request warning
# and stay silent.
#
# Pre-reqs:
#   - libgomesi.so exporting ParseJson
#
# Usage:
#   Drop these directives into a `location` block and reload nginx.
#   mesi_include_error_marker is location-scoped; nested locations
#   inherit the enclosing location's marker unless they set their own.

load_module modules/ngx_http_mesi_module.so;

server {
    listen 8080;

    # Debug-friendly default: an invisible HTML comment marks the spot
    # in the rendered DOM without changing the visible layout.
    location /debug/ {
        enable_mesi on;
        mesi_include_error_marker "<!-- ESI include failed -->";
        proxy_pass http://backend;
    }

    # Visible placeholder for staging/QA pages.
    location /staging/ {
        enable_mesi on;
        mesi_include_error_marker "[ESI ERROR]";
        proxy_pass http://backend;
    }

    # JSON-special characters are escaped on the way to libgomesi and
    # rendered verbatim in the HTML. In nginx config, \" embeds a quote
    # and \\ embeds a backslash.
    location /special/ {
        enable_mesi on;
        mesi_include_error_marker "<!-- \"quoted\" \\ / -->";
        proxy_pass http://backend;
    }

    # Production: an explicit empty value keeps failed includes silent
    # and clears a marker inherited from a broader location.
    location /prod/ {
        enable_mesi on;
        mesi_include_error_marker "";
        proxy_pass http://backend;

        # No directive here: inherits the parent's explicit empty
        # (configured but silent).
        location /prod/child/ {
            proxy_pass http://backend;
        }
    }

    # Unset -> silent, byte-identical to pre-#228 behaviour (the
    # legacy positional path).
    location / {
        enable_mesi on;
        proxy_pass http://backend;
    }
}

# The following are config-load ERRORS (`nginx -t` fails):
#   mesi_include_error_marker;                          # missing argument
#   mesi_include_error_marker <!-- ESI failed -->;      # unquoted spaces
#   mesi_include_error_marker "<!-- ESI failed -->" x;  # trailing token
#   mesi_include_error_marker "a"; mesi_include_error_marker "b";  # duplicate
